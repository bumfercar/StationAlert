name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Run FFmpeg integration tests
        run: uv run --frozen pytest tests/audio

      - name: Run evaluation unit tests
        run: uv run --frozen pytest tests/evaluation

      - name: Run RTZR unit tests
        run: uv run --frozen pytest tests/rtzr

      - name: Run CLI help contract tests
        run: uv run --frozen pytest tests/test_cli.py -k help

      - name: Run CLI behavior tests
        run: uv run --frozen pytest tests/test_cli.py -k "not help"

      - name: Run domain unit tests
        run: >-
          uv run --frozen pytest
          tests/test_detection.py
          tests/test_journey.py
          tests/test_station_extraction.py

      - name: Verify macOS and Linux demo script syntax
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/run_demo.sh

      - name: Verify Windows demo script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/run_demo.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run Ruff
        run: uv run --frozen ruff check .
